<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointora - Earn Points, Get Rewards</title>
<style>body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:20px}.card{background:white;color:#111;border-radius:16px;padding:20px;max-width:420px;margin:20px auto}input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}button{background:#7c3aed;color:white;border:0;font-weight:bold;font-size:16px}.pts{font-size:42px;color:#7c3aed;font-weight:bold}</style>
</head><body>
<h1>✨ Pointora</h1><p>Earn Points. Unlock Rewards. Invite Friends.</p>
<div class="card" id="authCard">
<h2>Join Pointora</h2>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email" type="email">
<input id="pass" placeholder="Password" type="password">
<input id="ref" placeholder="Referral Code (optional)">
<button onclick="signup()">Create Account & Get 100 Points 🎁</button>
<p id="msg"></p><p>Already have account? <a href="#" onclick="login()">Login</a></p>
</div>
<div class="card" id="dash" style="display:none">
<h2>Welcome, <span id="uName"></span> 👋</h2>
<div class="pts"><span id="points">0</span> pts</div>
<p>Your Referral Code: <b id="myCode"></b></p>
<p>Share: <span id="link"></span></p>
<button onclick="daily()">Claim Daily +10 Points</button>
<button onclick="logout()">Logout</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient("https://wnhtdtvjuzlstpwovnfw.supabase.co","sb_publishable_N73Me0qlOV9Ac2MMCrygdA_-8WhRPOw");
async function signup(){
let name=document.getElementById('name').value, email=document.getElementById('email').value, pass=document.getElementById('pass').value;
let {data,error}=await supabaseClient.auth.signUp({email,password:pass});
if(error){document.getElementById('msg').innerText=error.message;return;}
let code=name.slice(0,3).toUpperCase()+Math.floor(1000+Math.random()*9000);
await supabaseClient.from('users').insert([{id:data.user.id,email,name,points:100,referral_code:code}]);
document.getElementById('msg').innerText="Account created! Login now.";}
async function login(){
let email=document.getElementById('email').value, pass=document.getElementById('pass').value;
let {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
if(error){alert(error.message);return;}
let {data:u}=await supabaseClient.from('users').select('*').eq('id',data.user.id).single();
if(u){showDash(u)} else {showDash({name:email,points:100,referral_code:'POINT'})}}
function showDash(u){document.getElementById('authCard').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('uName').innerText=u.name;document.getElementById('points').innerText=u.points;document.getElementById('myCode').innerText=u.referral_code;document.getElementById('link').innerText=location.href+"?ref="+u.referral_code;}
async function daily(){alert("Daily +10 claimed! (Demo)");}
function logout(){location.reload();}
let p=new URLSearchParams(location.search).get('ref'); if(p) document.getElementById('ref').value=p;
</script></body></html>
